<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <defs>
    <linearGradient id="folio_dark_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E242B"/>
      <stop offset="100%" stop-color="#111419"/>
    </linearGradient>
    <filter id="folio_top_dark_shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="0" y="0" width="120" height="120" rx="27" fill="url(#folio_dark_bg)"/>
  <rect x="0.5" y="0.5" width="119" height="119" rx="26.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Bottom Card -->
  <rect x="28" y="71" width="26" height="23" rx="6" fill="#38BDF8" fill-opacity="0.32" stroke="#38BDF8" stroke-opacity="0.80" stroke-width="1.4"/>

  <!-- Middle Card -->
  <rect x="28" y="47.5" width="49" height="21" rx="6" fill="#93C5FD" fill-opacity="0.62" stroke="#BFDBFE" stroke-opacity="0.75" stroke-width="1.3"/>

  <!-- Top Card -->
  <rect x="28" y="24" width="64" height="21" rx="6" fill="#FAF9F5" filter="url(#folio_top_dark_shadow)"/>

  <!-- Accent Dot & Header Rule -->
  <circle cx="41" cy="34.5" r="4.5" fill="#EA580C"/>
  <rect x="50" y="32" width="28" height="5" rx="2.5" fill="#181C22" fill-opacity="0.78"/>
</svg>

name: Release macOS DMG

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Workspace Tests & Hygiene Checks
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26+ & configure Bazel CI profile
        run: |
          XCODE26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$XCODE26" ]]; then
            sudo xcode-select -s "$XCODE26/Contents/Developer"
          fi
          xcodebuild -version
          swiftc --version
          echo "common --config=ci" >> ~/.bazelrc

      - name: Cache Bazel repository & disk cache (test)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-test-macos26-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}-${{ hashFiles('core/**/*.rs', 'zed/**/*.rs', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            bazel-test-macos26-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}-
            bazel-test-macos26-${{ runner.os }}-

      - name: Cache Cargo workspace build artifacts (test)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-macos26-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('core/**/*.rs', 'zed/**/*.rs') }}
          restore-keys: |
            cargo-test-macos26-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-test-macos26-${{ runner.os }}-

      - name: Run all workspace tests and hygiene checks
        run: |
          python3 ./scripts/sync_cargo_mtimes.py restore . target
          ./scripts/audit_slop.sh
          python3 ./scripts/sync_cargo_mtimes.py record . target
          bazel test //...

  build-folio-dmg:
    name: Build & Package Folio.dmg
    runs-on: macos-26
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      engine_version: ${{ steps.meta.outputs.engine_version }}
      dmg_sha256: ${{ steps.meta.outputs.dmg_sha256 }}
      folio_graph_hash: ${{ steps.graph.outputs.hash }}
      commit_msg: ${{ steps.meta.outputs.commit_msg }}
    steps:
      - name: Checkout repository (full history for commit count build number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bazel repository & disk cache (opt)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-opt-macos26-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}-${{ hashFiles('Sources/**/*.swift', 'macos/**', 'core/**', 'BUILD.bazel', '.bazelrc') }}
          restore-keys: |
            bazel-opt-macos26-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}-
            bazel-opt-macos26-${{ runner.os }}-

      - name: Select Xcode 26+ & compute Folio.dmg Bazel graph hash
        id: graph
        run: |
          XCODE26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$XCODE26" ]]; then
            sudo xcode-select -s "$XCODE26/Contents/Developer"
          fi
          xcodebuild -version
          swiftc --version
          echo "common --config=ci" >> ~/.bazelrc
          chmod +x ./scripts/bazel_target_hash.sh
          GRAPH_HASH="$(./scripts/bazel_target_hash.sh //:package_folio_dmg)"
          echo "Computed //:package_folio_dmg Bazel graph hash: $GRAPH_HASH"
          echo "hash=$GRAPH_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore cached Folio.dmg if Bazel graph is unchanged
        id: dmg_cache
        uses: actions/cache@v4
        with:
          path: |
            Folio.dmg
            .folio_dmg_graph_hash
          key: folio-dmg-artifact-macos26-${{ steps.graph.outputs.hash }}

      - name: Reuse Folio.dmg from latest GitHub Release if Bazel graph is unchanged
        id: reuse_release
        if: steps.dmg_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HASH: ${{ steps.graph.outputs.hash }}
        run: |
          BODY="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body // ""' 2>/dev/null || true)"
          RELEASE_HASH="$(python3 -c '
          import json, re, sys
          m = re.search(r"<!--\s*folio-release:\s*(\{.*?\})\s*-->", sys.stdin.read(), re.S)
          if m:
              print(json.loads(m.group(1)).get("folio_graph_hash", ""))
          ' <<< "$BODY" 2>/dev/null || true)"
          if [[ -n "$RELEASE_HASH" && "$RELEASE_HASH" == "$EXPECTED_HASH" ]]; then
            echo "Latest release Folio.dmg matches Bazel graph hash ($EXPECTED_HASH); downloading existing Folio.dmg..."
            if gh release download latest --repo "${{ github.repository }}" --pattern "Folio.dmg" --clobber; then
              printf '%s\n' "$EXPECTED_HASH" > .folio_dmg_graph_hash
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "reused=false" >> "$GITHUB_OUTPUT"

      - name: Import Apple signing certificate (if configured in Secrets)
        id: codesign
        if: steps.dmg_cache.outputs.cache-hit != 'true' && steps.reuse_release.outputs.reused != 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY_OVERRIDE: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "No APPLE_CERTIFICATE_P12_BASE64 secret configured; using ad-hoc signing (-)."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/folio-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" && \
            security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH" "$RUNNER_TEMP/AppleWWDRCAG3.cer"

          if [[ -n "$APPLE_CODESIGN_IDENTITY_OVERRIDE" ]]; then
            IDENTITY="$APPLE_CODESIGN_IDENTITY_OVERRIDE"
          else
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk 'NR==1 {print $2}')
          fi

          if [[ -z "$IDENTITY" ]]; then
            echo "Warning: No valid codesigning identity found in imported p12; falling back to ad-hoc signing (-)."
            IDENTITY="-"
          else
            echo "Using Apple signing identity: $IDENTITY"
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build Folio.app and package Folio.dmg
        env:
          FOLIO_REPOSITORY: ${{ github.repository }}
          FOLIO_APP_GRAPH_HASH: ${{ steps.graph.outputs.hash }}
          APPLE_CODESIGN_IDENTITY: ${{ steps.codesign.outputs.identity || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x ./build_app.sh ./scripts/package_dmg.sh
          ./scripts/package_dmg.sh

      - name: Clean up temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/folio-signing.keychain-db" 2>/dev/null || true

      - name: Upload Folio.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio.dmg
          path: Folio.dmg
          retention-days: 14

      - name: Read build metadata from Folio.dmg
        id: meta
        run: |
          PLIST="Folio.app/Contents/Info.plist"
          if [[ ! -f "$PLIST" ]]; then
            PLIST="macos/FolioApp/Info.plist"
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD_NUM=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          SHA=$(git rev-parse --short HEAD 2>/dev/null || echo dev)
          ENGINE_VER=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' core/folio_engine/Cargo.toml 2>/dev/null || echo "0.1.0")
          SHA256=$(shasum -a 256 Folio.dmg | awk '{print $1}')
          COMMIT_MSG=$(git log -1 --pretty=%s)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "engine_version=$ENGINE_VER" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

  build-folio-zed-dmg:
    name: Build & Package Folio-Zed.dmg
    runs-on: macos-26
    outputs:
      zed_dmg_sha256: ${{ steps.meta.outputs.zed_dmg_sha256 }}
      zed_graph_hash: ${{ steps.graph.outputs.hash }}
    steps:
      - name: Checkout repository (full history for commit count build number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bazel repository & disk cache for Zed & Folio mod
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-zed-macos26-${{ runner.os }}-${{ hashFiles('third_party/zed/patches/0002-real-zed-editor-folio-wysiwyg.patch', 'third_party/zed/build_moddable_zed.sh') }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', 'core/**/*.rs', 'zed/**/*.rs', 'BUILD.bazel', '.bazelrc') }}
          restore-keys: |
            bazel-zed-macos26-${{ runner.os }}-${{ hashFiles('third_party/zed/patches/0002-real-zed-editor-folio-wysiwyg.patch', 'third_party/zed/build_moddable_zed.sh') }}-
            bazel-zed-macos26-${{ runner.os }}-

      - name: Select Xcode 26+ & compute Folio-Zed.dmg Bazel graph hash
        id: graph
        run: |
          XCODE26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$XCODE26" ]]; then
            sudo xcode-select -s "$XCODE26/Contents/Developer"
          fi
          xcodebuild -version
          swiftc --version
          echo "common --config=ci" >> ~/.bazelrc
          chmod +x ./scripts/bazel_target_hash.sh
          GRAPH_HASH="$(./scripts/bazel_target_hash.sh //:package_zed_dmg)"
          echo "Computed //:package_zed_dmg Bazel graph hash: $GRAPH_HASH"
          echo "hash=$GRAPH_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore cached Folio-Zed.dmg if Bazel graph is unchanged
        id: dmg_cache
        uses: actions/cache@v4
        with:
          path: |
            Folio-Zed.dmg
            .folio_zed_dmg_graph_hash
          key: folio-zed-dmg-artifact-macos26-${{ steps.graph.outputs.hash }}

      - name: Reuse Folio-Zed.dmg from latest GitHub Release if Bazel graph is unchanged
        id: reuse_release
        if: steps.dmg_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HASH: ${{ steps.graph.outputs.hash }}
        run: |
          BODY="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body // ""' 2>/dev/null || true)"
          RELEASE_HASH="$(python3 -c '
          import json, re, sys
          m = re.search(r"<!--\s*folio-release:\s*(\{.*?\})\s*-->", sys.stdin.read(), re.S)
          if m:
              print(json.loads(m.group(1)).get("zed_graph_hash", ""))
          ' <<< "$BODY" 2>/dev/null || true)"
          if [[ -n "$RELEASE_HASH" && "$RELEASE_HASH" == "$EXPECTED_HASH" ]]; then
            echo "Latest release Folio-Zed.dmg matches Bazel graph hash ($EXPECTED_HASH); downloading existing Folio-Zed.dmg..."
            if gh release download latest --repo "${{ github.repository }}" --pattern "Folio-Zed.dmg" --clobber; then
              printf '%s\n' "$EXPECTED_HASH" > .folio_zed_dmg_graph_hash
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "reused=false" >> "$GITHUB_OUTPUT"

      - name: Cache Rust toolchain for Zed
        if: steps.dmg_cache.outputs.cache-hit != 'true' && steps.reuse_release.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-zed-macos26-${{ runner.os }}-${{ hashFiles('build_zed_app.sh') }}
          restore-keys: |
            rustup-zed-macos26-${{ runner.os }}-

      - name: Cache Cargo & Moddable Zed build artifacts
        if: steps.dmg_cache.outputs.cache-hit != 'true' && steps.reuse_release.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third_party/zed/upstream/target
          key: cargo-zed-macos26-${{ runner.os }}-${{ hashFiles('third_party/zed/patches/0002-real-zed-editor-folio-wysiwyg.patch', 'third_party/zed/build_moddable_zed.sh') }}
          restore-keys: |
            cargo-zed-macos26-${{ runner.os }}-

      - name: Import Apple signing certificate (if configured in Secrets)
        id: codesign
        if: steps.dmg_cache.outputs.cache-hit != 'true' && steps.reuse_release.outputs.reused != 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY_OVERRIDE: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "No APPLE_CERTIFICATE_P12_BASE64 secret configured; using ad-hoc signing (-)."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/folio-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" && \
            security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH" "$RUNNER_TEMP/AppleWWDRCAG3.cer"

          if [[ -n "$APPLE_CODESIGN_IDENTITY_OVERRIDE" ]]; then
            IDENTITY="$APPLE_CODESIGN_IDENTITY_OVERRIDE"
          else
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk 'NR==1 {print $2}')
          fi

          if [[ -z "$IDENTITY" ]]; then
            echo "Warning: No valid codesigning identity found in imported p12; falling back to ad-hoc signing (-)."
            IDENTITY="-"
          else
            echo "Using Apple signing identity: $IDENTITY"
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build Folio Zed.app and package Folio-Zed.dmg
        env:
          FOLIO_REPOSITORY: ${{ github.repository }}
          FOLIO_ZED_PROFILE: release-fast
          FOLIO_ZED_GRAPH_HASH: ${{ steps.graph.outputs.hash }}
          APPLE_CODESIGN_IDENTITY: ${{ steps.codesign.outputs.identity || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x ./build_zed_app.sh ./scripts/package_zed_dmg.sh
          ./scripts/package_zed_dmg.sh

      - name: Clean up temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/folio-signing.keychain-db" 2>/dev/null || true

      - name: Smoke-test the Folio Zed single-instance check
        run: python3 -I third_party/zed/tests/single_instance_smoke_test.py Folio-Zed.dmg

      - name: Upload Folio-Zed.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Zed.dmg
          path: Folio-Zed.dmg
          retention-days: 14

      - name: Compute Folio-Zed.dmg SHA-256
        id: meta
        run: |
          ZED_SHA256=$(shasum -a 256 Folio-Zed.dmg | awk '{print $1}')
          echo "zed_dmg_sha256=$ZED_SHA256" >> "$GITHUB_OUTPUT"

  release:
    name: Update Rolling GitHub Release
    needs:
      - test
      - build-folio-dmg
      - build-folio-zed-dmg
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Folio.dmg and Folio-Zed.dmg artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update rolling 'latest' GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-folio-dmg.outputs.version }}
          BUILD_NUM: ${{ needs.build-folio-dmg.outputs.build_number }}
          SHA: ${{ needs.build-folio-dmg.outputs.commit_sha }}
          ENGINE_VER: ${{ needs.build-folio-dmg.outputs.engine_version }}
          DMG_SHA256: ${{ needs.build-folio-dmg.outputs.dmg_sha256 }}
          FOLIO_GRAPH_HASH: ${{ needs.build-folio-dmg.outputs.folio_graph_hash }}
          ZED_SHA256: ${{ needs.build-folio-zed-dmg.outputs.zed_dmg_sha256 }}
          ZED_GRAPH_HASH: ${{ needs.build-folio-zed-dmg.outputs.zed_graph_hash }}
          COMMIT_MSG: ${{ needs.build-folio-dmg.outputs.commit_msg }}
        run: |
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          METADATA_JSON=$(python3 -c 'import json, sys; print(json.dumps({
              "version": sys.argv[1],
              "build_number": int(sys.argv[2]),
              "commit_sha": sys.argv[3],
              "engine_version": sys.argv[4],
              "published_at": sys.argv[5],
              "dmg_url": f"https://github.com/{sys.argv[6]}/releases/latest/download/Folio.dmg",
              "dmg_sha256": sys.argv[7],
              "folio_graph_hash": sys.argv[8],
              "zed_dmg_url": f"https://github.com/{sys.argv[6]}/releases/latest/download/Folio-Zed.dmg",
              "zed_dmg_sha256": sys.argv[9],
              "zed_graph_hash": sys.argv[10],
              "notes": sys.argv[11],
          }))' "$VERSION" "$BUILD_NUM" "$SHA" "$ENGINE_VER" "$PUBLISHED_AT" "${{ github.repository }}" "$DMG_SHA256" "$FOLIO_GRAPH_HASH" "$ZED_SHA256" "$ZED_GRAPH_HASH" "$COMMIT_MSG")

          TAG="latest"
          TITLE="Folio v${VERSION} (Build #${BUILD_NUM} — ${SHA})"
          NOTES=$(cat <<EOF
          Automated rolling macOS build from \`main\` (${{ github.sha }}).

          - **App Version:** \`v${VERSION}\` (Build \`#${BUILD_NUM}\`)
          - **Core Engine (\`folio_engine\`):** \`v${ENGINE_VER}\`
          - **Folio.dmg SHA-256:** \`${DMG_SHA256}\`
          - **Folio-Zed.dmg SHA-256:** \`${ZED_SHA256}\`

          Existing installations of **Folio.app** and **Folio Zed.app** will automatically detect and install this build via **Check for Updates…** (or on launch).

          <!-- folio-release: ${METADATA_JSON} -->
          EOF
          )

          # Delete previous 'latest' tag/release so the tag points to the newest commit and stays marked as Latest
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            Folio.dmg \
            Folio-Zed.dmg \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

[package]
name = "folio_zed_mod"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Folio Typora-style hybrid Markdown + native LaTeX GPUI mod for Zed"

[lib]
name = "folio_zed_mod"
crate-type = ["rlib", "cdylib"]

[dependencies]
folio_engine = { path = "../../core/folio_engine" }

[[test]]
name = "session_tests"
path = "tst/session_tests.rs"

[[test]]
name = "ffi_tests"
path = "tst/ffi_tests.rs"

[[test]]
name = "behavior_suite"
path = "tst/behavior_suite.rs"

[lints]
workspace = true
